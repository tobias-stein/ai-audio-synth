[package]
name = "ai-audio-synth"
version = "0.1.0"
edition = "2021"
description = "aas: a procedural audio synthesis CLI designed for AI agents. Text in, WAV out, measurements back."
license = "MIT"

[[bin]]
name = "aas"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
include_dir = "0.7.4"
png = "0.18.1"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 2

[profile.profiling]
inherits = "release"
debug = true
