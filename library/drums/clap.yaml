description: Hand clap - several quick noise bursts and a short tail.
category: drums
duration: 0.5
tail: 0.4
params:
  tone: {default: 1300, min: 600, max: 3000, doc: "center frequency in Hz"}
nodes:
  bursts: {type: env, points: [[0, 1], [0.009, 0.1], [0.011, 0.9], [0.02, 0.1], [0.023, 0.8], [0.034, 0.15], [0.036, 1], [0.3, 0]], curve: exp}
  src: {type: noise, stereo: true, amp: bursts}
  band: {type: bandpass, in: src, cutoff: "tone * rand(0.95, 1.05)", q: 1.3}
  air: {type: highpass, in: src, cutoff: 5000}
  out: {type: gain, in: "band * 2 + air * 0.08", db: -6}
