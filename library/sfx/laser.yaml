description: Sci-fi laser shot with a fast downward pitch sweep.
category: weapon
profile: weapon
duration: 0.5
params:
  pitch: {default: 2600, min: 600, max: 6000, doc: "starting pitch in Hz"}
  length: {default: 0.22, min: 0.05, max: 0.4, doc: "seconds the sweep takes"}
nodes:
  env: {type: env, points: [[0, 1], [1, 0]], curve: exp, time_scale: "length * 1.3"}
  f: {type: sweep, from: "pitch * rand(0.92, 1.08)", to: 160, time: length}
  a: {type: osc, wave: saw, freq: f}
  b: {type: osc, wave: square, freq: "f * 1.01"}
  zap: {type: noise, amp: "env * env * env * 0.6"}
  body: {type: lowpass, in: "(a + b * 0.6) * env + zap", cutoff: "min(f * 4, 16000)", q: 3}
  bite: {type: distort, in: body, drive_db: 8, shape: tanh}
  echo: {type: delay, in: bite, time: 0.045, feedback: 0.35, mix: 0.25, pingpong: true}
  out: {type: reverb, in: echo, decay: 0.5, size: 0.6, mix: 0.12, predelay_ms: 0}
