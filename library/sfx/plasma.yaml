description: Heavy plasma or energy cannon blast with a growling FM body.
category: weapon
profile: weapon
duration: "0.7 + 0.9 * heft"
params:
  pitch: {default: 420, min: 150, max: 1200, doc: "starting pitch in Hz"}
  heft: {default: 0.6, min: 0, max: 1, doc: "0 = light blaster, 1 = heavy cannon"}
nodes:
  env: {type: env, points: [[0, 1], [0.06, 0.7], [0.7, 0]], curve: exp}
  f: {type: sweep, from: "pitch * rand(0.95, 1.05)", to: "70 - 25 * heft", time: 0.45}
  index: {type: sweep, from: 9, to: 0.5, time: 0.5}
  fm_mod: {type: osc, wave: sine, freq: "f * 1.51"}
  carrier: {type: osc, wave: sine, freq: f, pm: "fm_mod * index", amp: env}
  crack_env: {type: env, points: [[0, 0], [0.0004, 1], [0.03, 0]], curve: exp}
  crack: {type: noise, amp: crack_env}
  crack_f: {type: highpass, in: crack, cutoff: 1500}
  sub_env: {type: env, points: [[0, 0], [0.01, 1], [0.5, 0]], curve: exp}
  sub: {type: osc, wave: sine, freq: "60 - 15 * heft", amp: "sub_env * heft"}
  dirt: {type: distort, in: "carrier + crack_f * 0.7 + sub * 0.8", drive_db: "6 + 10 * heft", shape: tube}
  tone: {type: lowpass, in: dirt, cutoff: "9000 - 4000 * heft"}
  punch: {type: transient, in: tone, attack_db: 5}
  out: {type: reverb, in: punch, decay: "0.6 + 0.8 * heft", size: 1.2, mix: 0.18, predelay_ms: 5}
