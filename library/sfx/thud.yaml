description: Dull heavy impact - punches, body falls, landing after a jump, sacks dropping.
category: impact
profile: impact
duration: "0.35 + 0.35 * weight"
params:
  weight: {default: 0.5, min: 0, max: 1, doc: "0 = light pat, 1 = heavy slam"}
nodes:
  env: {type: env, points: [[0, 1], [1, 0]], curve: exp, time_scale: "0.14 + 0.25 * weight"}
  f: {type: sweep, from: "210 - 40 * weight", to: "85 - 25 * weight", time: 0.07}
  body: {type: osc, wave: sine, freq: "f * rand(0.95, 1.05)", amp: env}
  slap_env: {type: env, points: [[0, 1], [0.035, 0]], curve: exp}
  slap: {type: noise, color: pink, amp: "slap_env * 2.5"}
  slap_f: {type: bandpass, in: slap, cutoff: "1300 + 900 * rand(0, 1)", q: 0.7}
  sum: {type: mix, inputs: [body, slap_f], gains_db: [0, 2]}
  dirt: {type: distort, in: sum, drive_db: "8 + 6 * weight", shape: tube}
  tone: {type: lowpass, in: dirt, cutoff: 5000}
  out: {type: transient, in: tone, attack_db: 3}
