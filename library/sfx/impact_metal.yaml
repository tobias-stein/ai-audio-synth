description: Struck metal - pipes, shields, armor hits, clanks. Modal resonator excited by a short burst.
category: impact
profile: impact
duration: "0.35 + 1.6 * ring"
params:
  pitch: {default: 380, min: 80, max: 2000, doc: "pitch of the lowest resonance in Hz: low = large heavy object"}
  ring: {default: 0.5, min: 0, max: 1, doc: "0 = damped clank, 1 = long ringing"}
  hardness: {default: 0.7, min: 0, max: 1, doc: "0 = soft mallet, 1 = hard metal striker"}
nodes:
  hit_env: {type: env, points: [[0, 1], [0.004, 0]], curve: exp}
  hit: {type: noise, amp: hit_env}
  hit_f: {type: lowpass, in: hit, cutoff: "1500 + 12000 * hardness"}
  body: {type: modal, in: hit_f, modes: metal, freq: "pitch * rand(0.94, 1.06)", decay: "0.15 + 1.6 * ring", damping: "0.9 - 0.5 * ring", amp: 0.3}
  body2: {type: modal, in: hit_f, modes: plate, freq: "pitch * 1.37 * rand(0.94, 1.06)", decay: "0.1 + 0.9 * ring", damping: 0.8, amp: 0.2}
  thud_env: {type: env, points: [[0, 1], [0.09, 0]], curve: exp}
  thud: {type: osc, wave: sine, freq: "pitch * 0.4", amp: "thud_env * 0.3"}
  click: {type: highpass, in: "hit_f * 0.4", cutoff: 2000}
  sum: {type: mix, inputs: [body, body2, thud, click]}
  punch: {type: transient, in: sum, attack_db: 4}
  out: {type: reverb, in: punch, decay: 0.7, size: 0.7, mix: 0.12, predelay_ms: 3}
