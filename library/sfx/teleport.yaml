description: Sci-fi teleport or warp - a rising energy sweep that ends in a snap.
category: scifi
profile: whoosh
duration: 1.8
params:
  length: {default: 0.7, min: 0.2, max: 2, doc: "seconds of rising sweep before the snap"}
nodes:
  up: {type: expr, expr: "clamp(t / length, 0, 1)"}
  on: {type: expr, expr: "lt(t, length)"}
  f: {type: expr, expr: "90 * semi(54 * up * up)"}
  src: {type: osc, wave: saw, freq: f, unison: 5, detune: 30}
  tube: {type: comb, in: "src * up * on", freq: "200 + 2500 * up", feedback: 0.85}
  swirl: {type: phaser, in: tube, rate: 3, min_freq: 400, max_freq: 6000, feedback: 0.7, mix: 0.8}
  air_src: {type: noise, stereo: true}
  air: {type: bandpass, in: air_src, cutoff: "800 + 8000 * up", q: 3}
  snap_env: {type: expr, expr: "gt(t, length) * exp(-(t - length) * 30)"}
  snap_src: {type: noise, amp: snap_env}
  snap: {type: highpass, in: snap_src, cutoff: 1200}
  thump: {type: osc, wave: sine, freq: "60 + 200 * snap_env", amp: "0.4 * gt(t, length) * exp(-(t - length) * 12)"}
  sum: {type: mix, inputs: ["swirl * 0.5", "air * 1.2 * up * up * on", snap, thump], gains_db: [0, 0, 2, 0]}
  out: {type: reverb, in: sum, decay: 1.2, size: 1.3, mix: 0.25, predelay_ms: 5}
