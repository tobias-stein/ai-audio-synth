# The smallest useful score: drums, bass and chords over four bars.
# Render it with:  aas render minimal_score.yaml -o loop.wav --loop
kind: score
title: Minimal score
description: Drums, bass and chords over four bars.
tempo: 100
key: C minor
instruments:
  drums:
    kit: {kick: builtin:drums/kick, snare: builtin:drums/snare, hat: builtin:drums/hat_closed}
  bass: {patch: builtin:instruments/bass_synth, gain_db: -3}
  pad: {patch: builtin:instruments/pad_warm, gain_db: 2, sends: {hall: -6}}
buses:
  hall: {fx: [{type: reverb, decay: 2.5, mix: 1}]}
patterns:
  beat:
    drums:
      kick:  "x...x...x...x..."
      snare: "....x.......x..."
      hat:   "x.x.x.x.x.x.x.x."
  bassline: {notes: "C2:1 C2:0.5 Eb2:0.5 G2:1 Bb1:1 | Ab1:1 Ab1:0.5 C2:0.5 Eb2:1 G1:1"}
  chords: {chords: "Cm:4 Ab:4"}
sections:
  main: {bars: 4, tracks: {drums: beat, bass: bassline, pad: chords}}
