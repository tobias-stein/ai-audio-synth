description: Plucked string - harp, guitar-like arpeggios, koto and lute lines.
category: pluck
tail: 2.0
duration: 2.39
gate: 0.24
params:
  brightness: {default: 0.5, min: 0, max: 1, doc: "0 = soft nylon, 1 = bright steel"}
  sustain: {default: 3, min: 0.3, max: 10, doc: "ring time in seconds"}
nodes:
  string: {type: pluck, freq: freq, decay: sustain, brightness: "brightness * (0.5 + 0.5 * vel)", position: "rand(0.12, 0.3)"}
  damp: {type: adsr, attack: 0.001, decay: 0.01, sustain: 1, release: 0.6}
  body: {type: peak, in: string, freq: 220, gain_db: 3, q: 1.2}
  out: {type: gain, in: "body * damp", db: -8}
