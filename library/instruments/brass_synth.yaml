description: Bold synthetic brass - fanfares, stabs and heroic themes. A filter swell gives each note its "blat".
category: brass
tail: 0.4
duration: 1.15
gate: 0.6
params:
  brightness: {default: 0.6, min: 0, max: 1, doc: "0 = mellow horns, 1 = blaring trumpets"}
nodes:
  env: {type: adsr, attack: 0.04, decay: 0.2, sustain: 0.85, release: 0.18}
  blat: {type: adsr, attack: 0.07, decay: 0.3, sustain: 0.6, release: 0.2}
  vib_depth: {type: env, points: [[0, 0], [0.3, 0], [0.7, 1]], curve: smooth}
  vib: {type: lfo, rate: 5, amp: "0.004 * vib_depth"}
  saws: {type: osc, wave: saw, freq: "freq * (1 + vib)", unison: 4, detune: 12, spread: 0.6}
  filt: {type: lowpass, in: saws, cutoff: "300 + (1500 + 5000 * brightness) * blat * (0.5 + 0.5 * vel)", q: 1.3, slope: "24"}
  body: {type: peak, in: filt, freq: 1200, gain_db: 3, q: 1}
  out: {type: gain, in: "body * env", db: -16}
