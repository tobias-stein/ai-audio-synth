description: Breathy flute-like tone. Gentle folk melodies, pan-flute and whistle lines.
category: wind
tail: 0.3
duration: 1.41
gate: 0.96
params:
  breath: {default: 0.4, min: 0, max: 1, doc: "amount of air noise"}
nodes:
  env: {type: adsr, attack: 0.07, decay: 0.15, sustain: 0.85, release: 0.18}
  vib_depth: {type: env, points: [[0, 0], [0.25, 0], [0.7, 1]], curve: smooth}
  vib: {type: lfo, rate: 5, amp: "0.007 * vib_depth"}
  tone: {type: additive, freq: "freq * (1 + vib)", partials: [1, 0.35, 0.12, 0.05]}
  air_src: {type: noise, color: pink}
  air: {type: bandpass, in: air_src, cutoff: "freq * 2", q: 1.5}
  chiff_env: {type: env, points: [[0, 1], [0.08, 0]], curve: exp}
  out: {type: gain, in: "(tone * 0.7 + air * breath * (1 + 3 * chiff_env)) * env", db: -8}
