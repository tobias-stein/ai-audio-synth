description: Drawbar organ from summed sine harmonics. Sustained chords, retro and sacred styles.
category: keys
tail: 0.15
duration: 1.35
gate: 1.05
params:
  bright: {default: 0.5, min: 0, max: 1, doc: "level of the upper drawbars"}
nodes:
  env: {type: adsr, attack: 0.008, decay: 0.05, sustain: 1, release: 0.06}
  low: {type: additive, freq: freq, partials: [[0.5, 0.8], [1, 1], [1.5, 0.5], [2, 0.7]]}
  high: {type: additive, freq: freq, partials: [[3, 0.6], [4, 0.5], [5, 0.3], [6, 0.3], [8, 0.2]], amp: bright}
  click_env: {type: env, points: [[0, 1], [0.008, 0]], curve: exp}
  click: {type: noise, amp: "click_env * 0.15"}
  rotary: {type: chorus, in: "(low + high) * 0.35 * env + click", rate: 6, depth_ms: 1.2, mix: 0.35}
  out: {type: gain, in: rotary, db: -6}
